name: Daily Facebook Image Poster

on:
  schedule:
    - cron: '15 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only (no Facebook post)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: facebook-daily-poster
  cancel-in-progress: false

jobs:
  post:
    if: vars.FB_POSTING_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Post or validate
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: '581947825005691'
          FB_GRAPH_API_VERSION: ${{ vars.FB_GRAPH_API_VERSION }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python auto_poster.py --dry-run
          else
            python auto_poster.py --persist
          fi
      - name: Preserve state for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posting-state-${{ github.run_id }}
          path: state.json
          retention-days: 30
